name: personnel_app
description: Cerelo Personnel App — Internal operational tools for field staff.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cerelo_core:
    path: ../../packages/cerelo_core
  cerelo_api:
    path: ../../packages/cerelo_api
  cerelo_ui:
    path: ../../packages/cerelo_ui
  # Navigation
  go_router: ^14.3.0
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Supabase
  supabase_flutter: ^2.5.6
  # QR / Barcode scanner (fast native CameraX)
  mobile_scanner: ^5.2.3
  # Bluetooth thermal printing (ESC/POS)
  flutter_pos_printer_platform_image_3: ^1.0.6
  # PDF label generation
  pdf: ^3.11.1
  printing: ^5.13.1
  # Local cache
  sqflite: ^2.3.3+1
  path: ^1.9.0
  # Push notifications — requires google-services.json at build time
  # firebase_core: ^3.4.0
  # firebase_messaging: ^15.1.0
  # Crash reporting — enabled when SENTRY_DSN is non-empty
  sentry_flutter: ^8.8.0
  # Connectivity
  connectivity_plus: ^6.0.3
  # URL launcher (for share/print features)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
