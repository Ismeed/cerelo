name: cerelo_api
description: Cerelo V1 — Shared Supabase API client, typed DTOs, and data access layer. Used by customer_app and personnel_app.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cerelo_core:
    path: ../../packages/cerelo_core
  supabase_flutter: ^2.5.6
  # JSON serialization
  json_annotation: ^4.9.0
  # HTTP client
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  very_good_analysis: ^6.0.0
  mockito: ^5.4.4
